<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:"Fraunces"; src:url("assets/fonts/Fraunces-200.woff2") format("woff2"); font-weight:200; font-display:block }
      @font-face { font-family:"Fraunces"; src:url("assets/fonts/Fraunces-300.woff2") format("woff2"); font-weight:300; font-display:block }
      @font-face { font-family:"Karla"; src:url("assets/fonts/Karla-300.woff2") format("woff2"); font-weight:300; font-display:block }
      @font-face { font-family:"Karla"; src:url("assets/fonts/Karla-400.woff2") format("woff2"); font-weight:400; font-display:block }
      @font-face { font-family:"IBM Plex Mono"; src:url("assets/fonts/IBMPlexMono-400.woff2") format("woff2"); font-weight:400; font-display:block }
      @font-face { font-family:"IBM Plex Mono"; src:url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); font-weight:500; font-display:block }

      :root { --deep-purple:#3A1F5C; --royal-purple:#7A5CA8; --pale-lilac:#CBBFE0;
               --gold:#C2A053; --light-gold:#E0C88C; --half-white:#F4F1EC; --wipe:80% }
      * { margin:0; padding:0; box-sizing:border-box }
      html, body { width:1080px; height:1920px; overflow:hidden; background:var(--deep-purple) }
      body { font-family:"Karla",sans-serif; color:var(--half-white) }
      .clip { position:absolute; inset:0 }

      /* Beats arrive through an expanding circle rather than a dissolve. The
         mark is a seed with rings travelling outward, so an outward circular
         wipe is the brand's own gesture doing the cutting - not a stock
         transition dropped on top of it. */
      .wipe { clip-path:circle(var(--wipe) at 50% 42%) }

      .shot { position:absolute; inset:0; width:1080px; height:1920px;
               object-fit:cover; object-position:50% 50% }
      .vignette { position:absolute; inset:0; pointer-events:none;
               background:radial-gradient(115% 70% at 50% 42%, rgba(58,31,92,0) 42%, rgba(58,31,92,.80) 100%) }

      /* Type rises out of a clipped baseline, word by word. The mask is what
         makes it read as considered rather than faded-in. */
      .w { display:inline-block; overflow:hidden; vertical-align:bottom; padding:0 .06em }
      .w > i { display:inline-block; font-style:normal; will-change:transform }

      .say { position:absolute; inset:0; display:flex; flex-wrap:wrap; align-content:center; justify-content:center;
              padding:0 110px; text-align:center; font-family:"Fraunces",serif;
              font-weight:200; font-size:82px; line-height:1.26; letter-spacing:-.018em }
      .say--low { align-content:flex-end; padding-bottom:330px }

      .markwrap { position:absolute; inset:0; display:grid; place-items:center }
      .markwrap .mark { width:430px; height:430px; margin-bottom:300px; overflow:visible }
      .ring { fill:none; stroke-width:2.4 }
      .ring--1 { stroke:var(--half-white) } .ring--2 { stroke:var(--pale-lilac) }
      .ring--3 { stroke:var(--light-gold) } .seed { fill:var(--light-gold) }

      .caption { display:flex; align-items:flex-end; justify-content:center;
              padding:0 96px 250px; text-align:center }
      .caption span { font-family:"Karla",sans-serif; font-weight:300; font-size:44px;
              line-height:1.4; text-shadow:0 2px 26px rgba(24,10,40,.6) }

      .title { display:grid; place-content:center; justify-items:center; gap:26px }
      .title .big { font-family:"Fraunces",serif; font-weight:200; font-size:132px;
              letter-spacing:-.02em; line-height:1 }
      .rule { height:1px; background:var(--gold); width:0 }

      /* The ingredient list is the correction this cut exists to make: the
         panel has four actives, and the fourth is not optional. */
      .ingscrim { position:absolute; inset:0; pointer-events:none;
              background:linear-gradient(to top, rgba(58,31,92,.94) 6%, rgba(58,31,92,.80) 26%, rgba(58,31,92,.34) 44%, rgba(58,31,92,0) 62%) }
      .ings { position:absolute; left:96px; bottom:300px; display:grid; gap:22px; justify-items:start }
      .ings .row { font-family:"IBM Plex Mono",monospace; font-weight:400; font-size:34px;
              letter-spacing:.16em; color:var(--half-white); display:flex; align-items:center; gap:20px }
      .ings .row b { display:block; width:14px; height:1px; background:var(--gold); flex:none }
      .ings .row.key { color:var(--light-gold); font-weight:500 }
      .ings .why { font-family:"Karla",sans-serif; font-size:27px; letter-spacing:0;
              color:var(--pale-lilac); margin-left:34px; max-width:620px; line-height:1.35 }

      .end { display:grid; place-content:center; justify-items:center; gap:40px }
      .end .mark { width:230px; height:230px; overflow:visible }
      .end .wordmark { font-family:"Fraunces",serif; font-weight:200; font-size:82px; letter-spacing:.15em }
      .end .soon { font-family:"IBM Plex Mono",monospace; font-size:25px; letter-spacing:.28em; color:var(--light-gold) }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="22.655"
         data-width="1080" data-height="1920" data-fps="24">

      <!-- BEAT 1 - the mark builds under the words -->
      <div class="clip" id="b-mark" data-start="0.0" data-duration="6.1" data-track-index="1">
        <div class="markwrap">
          <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
            <path id="r3" class="ring ring--3" d="M 62.258 16.321 A 35.84 35.84 0 1 1 37.742 16.321"/>
            <path id="r2" class="ring ring--2" d="M 57.661 28.951 A 22.4 22.4 0 1 1 42.339 28.951"/>
            <path id="r1" class="ring ring--1" d="M 54.788 36.844 A 14.0 14.0 0 1 1 45.212 36.844"/>
            <circle id="seed" class="seed" cx="50" cy="50" r="5.2"/>
          </svg>
        </div>
        <div class="say say--low" id="say1"><span class="w"><i>A</i></span> <span class="w"><i>manthra</i></span> <span class="w"><i>is</i></span> <span class="w"><i>one</i></span> <span class="w"><i>word,</i></span> <span class="w"><i>repeated.</i></span></div>
        <div class="say say--low" id="say2" style="opacity:0"><span class="w"><i>Until</i></span> <span class="w"><i>it</i></span> <span class="w"><i>changes</i></span> <span class="w"><i>something.</i></span></div>
      </div>

      <!-- BEAT 2 - the spoon -->
      <video class="clip shot wipe" id="v-spoon" src="assets/footage/spoon.mp4"
             data-start="6.1" data-duration="5.62" data-media-start="0.4"
             data-track-index="1" muted playsinline></video>
      <div class="clip vignette" id="vig-spoon" data-start="6.1" data-duration="5.62" data-track-index="2"></div>
    <div class="clip caption" id="cap3" data-start="6.18" data-duration="2.55" data-track-index="4"><span>A body works the same way.</span></div>
    <div class="clip caption" id="cap4" data-start="8.63" data-duration="3.07" data-track-index="4"><span>One small dose, at the same hour.</span></div>

      <!-- BEAT 3 - the name -->
      <div class="clip title" id="b-title" data-start="11.72" data-duration="1.95" data-track-index="1">
        <div class="big"><span class="w"><i>Golden</i></span> <span class="w"><i>Milk</i></span></div>
        <div class="rule" id="title-rule"></div>
      </div>

      <!-- BEAT 4 - the bowls, with the real ingredient list -->
      <video class="clip shot wipe" id="v-dishes" src="assets/footage/dishes.mp4"
             data-start="13.67" data-duration="5.6" data-media-start="0.2"
             data-track-index="1" muted playsinline></video>
      <div class="clip vignette" id="vig-dishes" data-start="13.67" data-duration="5.6" data-track-index="2"></div>
      <div class="clip" id="b-ings" data-start="13.67" data-duration="5.6" data-track-index="3">
        <div class="ingscrim"></div>
        <div class="ings">
          <div class="row" id="ing1"><b></b>TURMERIC</div>
          <div class="row" id="ing2"><b></b>GINGER</div>
          <div class="row" id="ing3"><b></b>CINNAMON</div>
          <div class="row key" id="ing4"><b></b>BLACK PEPPER</div>
          <div class="why" id="ing-why">turmeric is poorly absorbed without it</div>
        </div>
      </div>

      <!-- BEAT 5 - end card -->
      <div class="clip end" id="b-end" data-start="19.27" data-duration="3.39" data-track-index="1">
        <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
          <path id="e3" class="ring ring--3" d="M 62.258 16.321 A 35.84 35.84 0 1 1 37.742 16.321"/>
          <path id="e2" class="ring ring--2" d="M 57.661 28.951 A 22.4 22.4 0 1 1 42.339 28.951"/>
          <path id="e1" class="ring ring--1" d="M 54.788 36.844 A 14.0 14.0 0 1 1 45.212 36.844"/>
          <circle id="eseed" class="seed" cx="50" cy="50" r="5.2"/>
        </svg>
        <div class="wordmark"><span class="w"><i>monk</i></span> <span class="w"><i>manthra</i></span></div>
        <div class="soon" id="soon">COMING SOON</div>
      </div>

    <audio id="vo1" src="assets/vo/af_heart-01.wav" data-start="0.80" data-duration="2.67" data-track-index="10" data-volume="1"></audio>
    <audio id="vo2" src="assets/vo/af_heart-02.wav" data-start="3.81" data-duration="2.02" data-track-index="10" data-volume="1"></audio>
    <audio id="vo3" src="assets/vo/af_heart-03.wav" data-start="6.30" data-duration="2.15" data-track-index="10" data-volume="1"></audio>
    <audio id="vo4" src="assets/vo/af_heart-04.wav" data-start="8.75" data-duration="2.67" data-track-index="10" data-volume="1"></audio>
    <audio id="vo5" src="assets/vo/af_heart-05.wav" data-start="11.88" data-duration="1.65" data-track-index="10" data-volume="1"></audio>
    <audio id="vo6" src="assets/vo/af_heart-06.wav" data-start="13.79" data-duration="2.17" data-track-index="10" data-volume="1"></audio>
    <audio id="vo7" src="assets/vo/af_heart-07.wav" data-start="16.13" data-duration="2.90" data-track-index="10" data-volume="1"></audio>
    <audio id="vo8" src="assets/vo/af_heart-08.wav" data-start="19.43" data-duration="2.38" data-track-index="10" data-volume="1"></audio>
      <audio id="bed" src="assets/vo/drone.wav" data-start="0" data-duration="22.655"
             data-track-index="11" data-volume="1"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const RISE = { yPercent: 108 };

      // Words rise out of their own mask, overlapping rather than marching:
      // 0.055s apart with a 0.72s travel means each word is still moving when
      // the next starts, which is what stops a stagger reading as mechanical.
      function say(sel, at, stagger) {
        gsap.set(sel + " > .w > i", RISE);
        tl.to(sel + " > .w > i", { yPercent:0, duration:.72, ease:"power3.out",
              stagger: stagger || .055 }, at);
      }

      // --- Beat 1 -----------------------------------------------------------
      const LEN = { r1:78.19, r2:125.11, r3:200.17 };
      ["r1","r2","r3"].forEach(function (id) {
        gsap.set("#" + id, { strokeDasharray: LEN[id], strokeDashoffset: LEN[id],
                             transformOrigin:"50% 50%" });
      });
      gsap.set("#seed", { transformOrigin:"50% 50%", scale:0 });

      // The seed settles once with a soft overshoot. Once, on arrival - the
      // guide bans the pulse, not the arrival.
      tl.to("#seed", { scale:1, duration:.9, ease:"back.out(2.2)" }, .30);
      say("#say1", .62);

      // Rings draw outward, each starting before the last finishes.
      tl.to("#r1", { strokeDashoffset:0, duration:1.15, ease:"power2.inOut" }, 1.55)
        .to("#say1", { opacity:0, y:-26, duration:.5, ease:"power2.in" }, 3.31)
        .to("#say2", { opacity:1, duration:.01 }, 3.77);
      say("#say2", 3.79);
      tl.to("#r2", { strokeDashoffset:0, duration:1.25, ease:"power2.inOut" }, 3.71)
        .to("#r3", { strokeDashoffset:0, duration:1.5,  ease:"power2.inOut" }, 4.09);

      // The whole mark drifts outward as the last ring lands, so the cut to
      // footage inherits movement instead of starting one.
      tl.to("#b-mark .mark", { scale:1.16, duration:1.5, ease:"power1.in" }, 4.60)
        .to("#b-mark", { opacity:0, duration:.42, ease:"power2.in" }, 5.68);
      tl.set("#b-mark", { opacity:0 }, 6.1);

      // --- Ring wipes -------------------------------------------------------
      // Each footage beat opens as a circle expanding from the mark's centre.
      [["#v-spoon", 6.1], ["#v-dishes", 13.67]].forEach(function (b) {
        gsap.set(b[0], { "--wipe":"0%" });
        tl.to(b[0], { "--wipe":"85%", duration:.86, ease:"power2.inOut" }, b[1]);
      });
      [["#vig-spoon",6.1,5.62],
       ["#vig-dishes",13.67,5.6]].forEach(function (b) {
        tl.fromTo(b[0], { opacity:0 }, { opacity:1, duration:.6 }, b[1]);
        tl.to(b[0], { opacity:0, duration:.34 }, b[1] + b[2] - .34);
      });
      tl.to("#v-spoon",  { opacity:0, duration:.34 }, 11.38);
      tl.set("#v-spoon", { opacity:0 }, 11.72);
      tl.to("#v-dishes", { opacity:0, duration:.4 },  18.87);
      tl.set("#v-dishes", { opacity:0 }, 19.27);

      // Slow push through the footage - the crop window travels, and stays
      // left of 67% so the source watermark never enters frame.
      tl.fromTo("#v-spoon", { objectPosition:"42% 50%" },
                { objectPosition:"55% 50%", duration:5.62, ease:"none" }, 6.1);
      tl.fromTo("#v-dishes", { objectPosition:"6% 50%" },
                { objectPosition:"66% 50%", duration:5.6, ease:"power1.inOut" }, 13.67);

      // --- Beat 3: the name -------------------------------------------------
      say("#b-title .big", 11.84, .09);
      tl.fromTo("#title-rule", { width:0 }, { width:180, duration:.8, ease:"power2.out" }, 12.14)
        .to("#b-title", { opacity:0, duration:.34, ease:"power2.in" }, 13.33);
      tl.set("#b-title", { opacity:0 }, 13.67);

      // --- Beat 4: the ingredients, each on its own word --------------------
      // Timed to the voiceover's commas. Black pepper arrives on its own line,
      // late and in gold, because it is the one people leave out.
      [["#ing1",13.89],["#ing2",14.52],
       ["#ing3",15.13],["#ing4",16.43]].forEach(function (r) {
        gsap.set(r[0], { opacity:0, x:-22 });
        tl.to(r[0], { opacity:1, x:0, duration:.62, ease:"power3.out" }, r[1]);
        gsap.set(r[0] + " b", { scaleX:0, transformOrigin:"0% 50%" });
        tl.to(r[0] + " b", { scaleX:1, duration:.5, ease:"power2.out" }, r[1] + .08);
      });
      gsap.set("#ing-why", { opacity:0, y:10 });
      tl.to("#ing-why", { opacity:1, y:0, duration:.7, ease:"power2.out" }, 17.18)
        .to("#b-ings", { opacity:0, duration:.36, ease:"power2.in" }, 18.91);
      tl.set("#b-ings", { opacity:0 }, 19.27);

      // --- Beat 5: end card -------------------------------------------------
      ["e1","e2","e3"].forEach(function (id, i) {
        var k = "r" + (i + 1);
        gsap.set("#" + id, { strokeDasharray: LEN[k], strokeDashoffset: LEN[k] });
        tl.to("#" + id, { strokeDashoffset:0, duration:1.0, ease:"power2.out" }, 19.42 + i * .13);
      });
      gsap.set("#eseed", { transformOrigin:"50% 50%", scale:0 });
      gsap.set("#soon", { opacity:0, y:14, scaleX:1.06, transformOrigin:"50% 50%" });
      tl.to("#eseed", { scale:1, duration:.7, ease:"back.out(2)" }, 19.37);
      say("#b-end .wordmark", 19.77, .045);
      tl.to("#soon", { opacity:1, y:0, scaleX:1, duration:1.1, ease:"power3.out" }, 20.42);
      tl.fromTo("#b-end", { opacity:0 }, { opacity:1, duration:.4 }, 19.27);

      // --- Captions on the footage beats only -------------------------------
      // The motion-graphic beats already set their words as display type;
      // captioning them too would say everything twice.
      document.querySelectorAll(".caption").forEach(function (el) {
        var s = parseFloat(el.dataset.start), d = parseFloat(el.dataset.duration);
        tl.fromTo(el, { opacity:0, y:12 }, { opacity:1, y:0, duration:.34, ease:"power2.out" }, s);
        tl.to(el, { opacity:0, duration:.26, ease:"power1.in" }, s + d - .26);
      });

      tl.to("#bed", { volume:.5, duration:.8 }, .6)
        .to("#bed", { volume:.95, duration:1.4 }, 19.27);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
